# ============================================================
# 完整编译版工作流：把汉化版 vless-core-app 编译成 .deb 安装包
# 前置：探路版已确认云端能搭出 32 位老编译器
# 补齐探路缺的 13 项：新签名工具、Blocks 运行库、OpenSSL 两架构、
#   curl 两架构、证书包、补丁状态文件
# 用法：上传到 .github/workflows/build.yml，Actions 页面点运行
#
# 英文名词对照：
#   workflow=自动化流程  job=大任务  step=小步骤  runner=云电脑
#   artifact=产物  checkout=下载代码
# ============================================================

name: 完整编译 - 汉化版 .deb

on:
  workflow_dispatch:

jobs:
  build:
    name: 编译汉化版安装包
    runs-on: ubuntu-22.04
    # 编译 OpenSSL + curl 两遍较久，给足 3 小时
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      # --------------------------------------------------------
      - name: 第 0 步 取出源码
        uses: actions/checkout@v4
        with:
          path: vless-core-app

      # --------------------------------------------------------
      - name: 第 1 步 安装系统依赖
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang cmake ninja-build autoconf automake libtool \
            bison flex patch xz-utils bzip2 lzma-alone \
            zlib1g-dev libssl-dev libxml2-dev libbz2-dev \
            liblzma-dev libsqlite3-dev uuid-dev \
            libblocksruntime-dev \
            gnustep-base-runtime libgnustep-base-dev gnustep-make libobjc-dev \
            python3 python3-pip file git curl make wget \
            libclang-dev llvm-dev >/dev/null 2>&1
          echo "系统依赖装好了"
          clang --version | head -1
          # 确认测试需要的 GNUstep 工具真的装上了
          gnustep-config --variable=GNUSTEP_SYSTEM_HEADERS >/dev/null
          echo "GNUstep 测试依赖已就位"

      # --------------------------------------------------------
      - name: 第 2 步 下载三套 iOS 软件开发包
        run: |
          set -e
          mkdir -p toolchains/sdks toolchains/ios6/SDK
          echo "下载 iOS 10.3 / 11.4 ..."
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git /tmp/theos-sdks >/dev/null 2>&1
          cd /tmp/theos-sdks
          git sparse-checkout set iPhoneOS10.3.sdk iPhoneOS11.4.sdk >/dev/null 2>&1
          cp -a iPhoneOS10.3.sdk "$GITHUB_WORKSPACE/toolchains/sdks/"
          cp -a iPhoneOS11.4.sdk "$GITHUB_WORKSPACE/toolchains/sdks/"
          echo "下载 iOS 6.1 ..."
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/EachAndOther/Legacy-iOS-SDKs.git /tmp/legacy-sdks >/dev/null 2>&1
          cd /tmp/legacy-sdks
          git sparse-checkout set iPhoneOS6.1.sdk >/dev/null 2>&1
          cp -a iPhoneOS6.1.sdk "$GITHUB_WORKSPACE/toolchains/ios6/SDK/"
          echo "三套软件开发包就位:"
          ls -d "$GITHUB_WORKSPACE"/toolchains/ios6/SDK/iPhoneOS6.1.sdk \
                "$GITHUB_WORKSPACE"/toolchains/sdks/iPhoneOS*.sdk

      # --------------------------------------------------------
      - name: 第 3 步 搭建 32 位老编译器
        id: toolchain
        timeout-minutes: 30
        run: |
          set -e
          git clone --depth 1 \
            https://github.com/tpoechtrager/cctools-port.git /tmp/cctools-port >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE/toolchains/ios6/SDK"
          tar -czf "$GITHUB_WORKSPACE/iPhoneOS6.1.sdk.tar.gz" iPhoneOS6.1.sdk
          cd /tmp/cctools-port/usage_examples/ios_toolchain
          JOBS=2 ./build.sh "$GITHUB_WORKSPACE/iPhoneOS6.1.sdk.tar.gz" armv7 2>&1 | tail -30
          # 复制到项目要用的位置
          mkdir -p "$GITHUB_WORKSPACE/toolchains/ios6/bin"
          cp -a target/bin/* "$GITHUB_WORKSPACE/toolchains/ios6/bin/"
          cp -a target/SDK/. "$GITHUB_WORKSPACE/toolchains/ios6/SDK/" 2>/dev/null || true
          echo "老编译器就位:"
          ls "$GITHUB_WORKSPACE/toolchains/ios6/bin/" | tr '\n' ' '

      # --------------------------------------------------------
      - name: 第 4 步 补齐签名工具和运行库
        run: |
          set -e
          BIN="$GITHUB_WORKSPACE/toolchains/ios6/bin"
          LIBDIR="$GITHUB_WORKSPACE/toolchains/ios6/lib"
          mkdir -p "$LIBDIR"
          # 新签名工具：Procursus 官方 Linux 版
          echo "下载新签名工具 ..."
          curl -fsSL --retry 3 \
            "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus8/ldid_linux_x86_64" \
            -o "$BIN/ldid-procursus"
          chmod +x "$BIN/ldid-procursus"
          echo "新签名工具版本: $("$BIN/ldid-procursus" -v 2>&1 | head -1)"
          # Blocks 运行库：从系统包里找
          echo "找 Blocks 运行库 ..."
          BLK=$(find /usr/lib /lib -name 'libBlocksRuntime.so*' -type f 2>/dev/null | head -1)
          if [ -z "$BLK" ]; then
            BLK=$(find /usr/lib /lib -name 'libBlocksRuntime.a' -type f 2>/dev/null | head -1)
          fi
          echo "找到: $BLK"
          cp "$BLK" "$LIBDIR/libBlocksRuntime.so"
          ls -l "$LIBDIR/libBlocksRuntime.so"

      # --------------------------------------------------------
      - name: 第 5 步 准备核心依赖源码和预编译内核
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          echo "下载 vless-core-cli 源码 ..."
          git clone --depth 1 --branch v2.0.2 \
            https://github.com/notfence/vless-core-cli.git vless-core-cli >/dev/null 2>&1
          echo "下载预编译内核（32位/64位）..."
          cd vless-core-cli
          BASE="https://github.com/notfence/vless-core-cli/releases/download/v2.0.2"
          for name in vless-core-darwin-armv7 vless-core-darwin-arm64; do
            curl -fsSL --retry 3 --max-time 180 "$BASE/$name.tar.gz" -o "/tmp/$name.tar.gz"
            tar -xzf "/tmp/$name.tar.gz"
          done
          ls -lh vless-core-darwin-armv7 vless-core-darwin-arm64
          echo "下载证书包 ..."
          mkdir -p third_party
          curl -fsSL --retry 3 https://curl.se/ca/cacert.pem -o third_party/cacert.pem
          ls -lh third_party/cacert.pem

      # --------------------------------------------------------
      - name: 第 6 步 编译 32 位加密库 OpenSSL
        id: openssl32
        timeout-minutes: 30
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/vless-core-cli"
          export IOS_TOOLCHAIN="$GITHUB_WORKSPACE/toolchains/ios6"
          export IOS_SDK="$IOS_TOOLCHAIN/SDK/iPhoneOS6.1.sdk"
          # 公开环境没有私有汇编补丁，用无汇编版本
          OPENSSL_NO_ASM=1 make openssl-ios6
          echo "32位加密库完成:"
          ls -lh third_party/openssl-ios6-armv7/lib/libssl.a \
                 third_party/openssl-ios6-armv7/lib/libcrypto.a
          cat third_party/openssl-ios6-armv7/VLESS_OPENSSL_PATCH_STATUS

      # --------------------------------------------------------
      - name: 第 7 步 编译 64 位加密库 OpenSSL
        id: openssl64
        timeout-minutes: 30
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/vless-core-cli"
          export IOS_TOOLCHAIN="$GITHUB_WORKSPACE/toolchains/ios6"
          export IOS_SDK="$GITHUB_WORKSPACE/toolchains/ios6/SDK/iPhoneOS6.1.sdk"
          export IOS_ARM64_SDK="$GITHUB_WORKSPACE/toolchains/sdks/iPhoneOS11.4.sdk"
          make openssl-ios-arm64
          echo "64位加密库完成:"
          ls -lh third_party/openssl-ios-arm64/lib/libssl.a \
                 third_party/openssl-ios-arm64/lib/libcrypto.a
          cat third_party/openssl-ios-arm64/VLESS_OPENSSL_PATCH_STATUS

      # --------------------------------------------------------
      - name: 第 8 步 编译 32 位和 64 位 zlib + curl
        id: curlbuild
        timeout-minutes: 40
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/vless-core-cli"
          export IOS_TOOLCHAIN="$GITHUB_WORKSPACE/toolchains/ios6"
          export IOS_SDK="$IOS_TOOLCHAIN/SDK/iPhoneOS6.1.sdk"
          export IOS_ARM64_SDK="$GITHUB_WORKSPACE/toolchains/sdks/iPhoneOS11.4.sdk"
          echo "编译 32 位 zlib + curl ..."
          make zlib-ios6
          make curl-ios6
          echo "编译 64 位 zlib + curl ..."
          make zlib-ios-arm64
          make curl-ios-arm64
          echo "curl 就位:"
          ls -lh third_party/curl-ios6-armv7/bin/curl \
                 third_party/curl-ios-arm64/bin/curl

      # --------------------------------------------------------
      - name: 第 9 步 打汉化补丁
        id: hanhua
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/vless-core-app"
          # 汉化补丁分段写入（避免超长单行），再解码应用
          : > /tmp/zh.b64
          printf '%s' '' > /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          printf '%s' '' >> /tmp/zh.b64
          base64 -d /tmp/zh.b64 > /tmp/apply_zh.patch
          git apply --unsafe-paths --ignore-whitespace /tmp/apply_zh.patch
          echo "汉化补丁打上了，抽查:"
          grep -m1 'question:@"' app/help_controllers.m
          grep -m1 '已连接\|Connected' app/main_connection.m || true

      # --------------------------------------------------------
      - name: 第 10 步 绕开时间戳坑
        run: |
          set -e
          # 检查器要求：加密库文件不能比内核/curl 二进制新。
          # 我们把所有加密库时间戳调到 2020 年，永远比二进制旧。
          cd "$GITHUB_WORKSPACE/vless-core-cli"
          touch -d '2020-01-01 00:00:00 UTC' \
            third_party/openssl-ios6-armv7/lib/libssl.a \
            third_party/openssl-ios6-armv7/lib/libcrypto.a \
            third_party/openssl-ios6-armv7/VLESS_OPENSSL_PATCH_STATUS \
            third_party/openssl-ios-arm64/lib/libssl.a \
            third_party/openssl-ios-arm64/lib/libcrypto.a \
            third_party/openssl-ios-arm64/VLESS_OPENSSL_PATCH_STATUS
          echo "时间戳已调整"

      # --------------------------------------------------------
      - name: 第 11 步 环境自检
        id: preflight
        run: |
          set -e
          export PATH="$GITHUB_WORKSPACE/toolchains/ios6/bin:$PATH"
          export IOS_TOOLCHAIN="$GITHUB_WORKSPACE/toolchains/ios6"
          export IOS_SDK="$IOS_TOOLCHAIN/SDK/iPhoneOS6.1.sdk"
          export APP_IOS_SDK="$GITHUB_WORKSPACE/toolchains/sdks/iPhoneOS10.3.sdk"
          export ARM64_IOS_SDK="$GITHUB_WORKSPACE/toolchains/sdks/iPhoneOS11.4.sdk"
          cd "$GITHUB_WORKSPACE/vless-core-app"
          make check-ios-toolchain
          make check-package-inputs
          echo "环境自检全部通过"

      # --------------------------------------------------------
      - name: 第 12 步 编译 .deb 安装包
        id: compile
        timeout-minutes: 60
        run: |
          set -e
          export PATH="$GITHUB_WORKSPACE/toolchains/ios6/bin:$PATH"
          export IOS_TOOLCHAIN="$GITHUB_WORKSPACE/toolchains/ios6"
          export IOS_SDK="$IOS_TOOLCHAIN/SDK/iPhoneOS6.1.sdk"
          export APP_IOS_SDK="$GITHUB_WORKSPACE/toolchains/sdks/iPhoneOS10.3.sdk"
          export ARM64_IOS_SDK="$GITHUB_WORKSPACE/toolchains/sdks/iPhoneOS11.4.sdk"
          cd "$GITHUB_WORKSPACE/vless-core-app"
          make deb
          echo "编译完成:"
          ls -lh build/*.deb

      # --------------------------------------------------------
      - name: 第 13 步 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: vless-core-汉化版-deb
          path: vless-core-app/build/*.deb
          if-no-files-found: error

      # --------------------------------------------------------
      - name: 第 14 步 成功提示
        if: success()
        run: |
          {
            echo "## 编译成功"
            echo ""
            echo "汉化版安装包已经生成，在「Artifacts」里下载："
            echo "**vless-core-汉化版-deb**"
            echo ""
            echo "下载后解压得到 .deb 文件，用 Filza 或爱思助手装到越狱设备上。"
          } >> "$GITHUB_STEP_SUMMARY"
